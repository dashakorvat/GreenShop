<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <span class="close">×</span>
      <div class="account">
        <div class="login_content">
          <a class="disabled" href="login.html">Login</a>
          <span>|</span>
          <a class="active" href="index.html">Register</a>
        </div>
        <p class="content">Enter your email and password to login.</p>
        <form>
          <input type="email" placeholder="Enter your email address" />
          <input type="password" placeholder="Password" />
          <button class="confirm">Log in</button>
        </form>
        <div class="separation">
          <span>Or log in with</span>
        </div>
        <div class="social">
          <button class="google">
            <img src="images/google.svg" alt="icon" />
            Continue with Google
          </button>
          <button class="facebook">
            <img src="images/facebook.svg" alt="icon2" />
            Continue with Facebook
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
