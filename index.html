<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>greenshop</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="catalog-container">
      <aside class="sidebar">
        <h3 class="title">Categories</h3>

        <ul class="categories">
          <li>
            <a href="#"><span>House Plants</span></a>
          </li>
          <li><a href="#">Potter Plants</a></li>
          <li><a href="#">Seeds</a></li>
          <li><a href="#">Small Plants</a></li>
          <li><a href="#">Big Plants</a></li>
          <li><a href="#">Succulents</a></li>
          <li><a href="#">Terrariums</a></li>
          <li><a href="#">Gardening</a></li>
          <li><a href="#">Accessories</a></li>
        </ul>
        <div class="banner">
          <img src="images/super-sale-banner.png" alt="sale banner" />
        </div>
      </aside>
      <div class="bar">
        <ul class="filter">
          <li class="active">
            <a href="#"><span>All Plants</span></a>
          </li>
          <li class="active"><a href="#">New Arrivals</a></li>
          <li class="active"><a href="#">Sale</a></li>
        </ul>

        <div class="sort">
          Sort by:
          <label class="select-wrapper">
            <select>
              <option value="1">Default sorting</option>
              <option value="2">Price</option>
            </select>
            <img src="images/arrow.svg" class="arrow" alt="arrow" />
          </label>
        </div>
      </div>
      <div class="products">
        <div class="img product">
          <img src="images/p1.png" alt="plant" />
        </div>
        <p class="product-name">Barberton Daisy</p>
        <p class="product-price">$119.00</p>
      </div>
      <div class="pagination">
        <a class="active" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">></a>
      </div>
    </div>
  </body>
</html>
